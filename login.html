<!-- login.html -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión - ConectadoYA</title>
  <style>
    body {
      background: linear-gradient(to bottom, #e1f0fb, #cde5f6);
      font-family: "Comic Sans MS", cursive;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #000;
    }
    .login-box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      border: 2px solid #69b4ff;
      box-shadow: 0 0 10px #69b4ff;
      width: 400px;
      text-align: center;
    }
    .login-box h2 {
      color: #0078D7;
      margin-bottom: 20px;
    }
    input[type="email"], input[type="password"] {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #0078D7;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover {
      background: #005fa3;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>ConectadoYA</h2>
    <img src="https://icons.iconseeker.com/png/fullsize/live-messenger-icon/live-messenger-blue.png" width="80" alt="Avatar"><br><br>
    <input id="correo" type="email" placeholder="ejemplo@chat.com"><br>
    <input id="contrasena" type="password" placeholder="Contraseña"><br>
    <button id="loginBtn">Iniciar sesión</button>
    <p><a href="register.html">¿Olvidaste tu contraseña?</a></p>
  </div>

  <script>
    document.getElementById("loginBtn").addEventListener("click", function() {
      // Aquí podrías validar correo y contraseña si usas Firebase.
      window.location.href = "ConectadoYa.html";
    });
  </script>
</body>
</html>
