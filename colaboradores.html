      background-size: cover;
      background-attachment: fixed;

      padding: 0;
      color: black;

    .icono {
      width: 64px;

      color: white;
      text-shadow: 1px 1px 2px black;

    }

      border-top-left-radius: 3px;

    .contenido {
      padding: 12px;
      background: #ffffff;
    }

    .contenido ul {
      padding-left: 20px;
      margin: 10px 0;
    }

    .contenido a {
      color: #0000cc;
      text-decoration: underline;
    }

    .contenido img {
      max-width: 100%;
      margin-top: 10px;
      border: 1px solid #000;
    }

    textarea {
      font-size: 16px;
      padding: 8px;
      width: 100%;
      height: 100px;
      resize: none;
      font-family: monospace;
    }

    button {
      padding: 6px 14px;
      margin-top: 10px;
      font-weight: bold;
      background: #cceeff;
      border: 2px solid #000080;
      cursor: pointer;
      border-radius: 4px;
    }

    #foxyJump {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 999;
      width: 300px;
    }
  </style>
</head>

<!-- Script: mover ventanas + comandos -->
<script>
  // Función para mover ventanas
  function hacerVentanaArrastrable(barraId, ventanaId) {
    const barra = document.getElementById(barraId);
    const ventana = document.getElementById(ventanaId);
    let offsetX = 0, offsetY = 0, isDragging = false;

    barra.addEventListener("mousedown", (e) => {
      isDragging = true;
      offsetX = e.clientX - ventana.offsetLeft;
      offsetY = e.clientY - ventana.offsetTop;
    });

    document.addEventListener("mousemove", (e) => {
      if (isDragging) {
        ventana.style.left = (e.clientX - offsetX) + "px";
        ventana.style.top = (e.clientY - offsetY) + "px";
      }
    });

    document.addEventListener("mouseup", () => isDragging = false);
  }

  hacerVentanaArrastrable("barraDrag", "ventanaXP");
  hacerVentanaArrastrable("barraBlog", "blogNotas");

  // Comandos en blog de notas
  function procesarComando() {
    const input = document.getElementById("entradaComando").value.trim().toLowerCase();
    const fox = document.getElementById("foxyJump");
    const audioFoxy = document.getElementById("audioFoxy");
    const audioRCN = document.getElementById("audioRCN");
    const resultado = document.getElementById("resultadoComando");

    resultado.innerHTML = "";

    if (input.includes("alt+f4")) {
      fox.style.display = "block";
      audioFoxy.play();
      resultado.innerHTML = "¡Foxy ha sido liberado!";
    } else if (input.includes("rcn nuestra tele")) {
      audioRCN.play();
      resultado.innerHTML = "¡Último minuto en RCN!";
    } else {
      resultado.innerHTML = "Comando no reconocido.";
    }
  }
</script>
