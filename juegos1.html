    h1 {

      text-align: center;
      box-shadow: 0 0 10px #ff000088;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .juego:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff0000cc;
    }

    .juego img {
      width: 100%;
      border-radius: 8px;
    }

    .juego h3 {
      margin: 10px 0;
      font-size: 18px;
      color: #ffaaaa;
    }

    .juego a {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 16px;
      background: #e50914;
      color: white;
      border-radius: 6px;

</head>
